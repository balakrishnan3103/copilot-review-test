name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    name: Copilot PR Review
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: |
          mvn clean test
          mvn verify

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `## 🤖 Copilot Code Review
            
            Thank you for your contribution! The code has been reviewed according to the guidelines in \`.github/copilot-instructions.md\`.
            
            ### Build Status
            - Build: ${{ job.status }}
            
            Please ensure your code follows the project guidelines:
            - ✅ All public methods have Javadoc comments
            - ✅ Unit tests are present and passing  
            - ✅ Code follows Java naming conventions
            - ✅ No commented-out code
            - ✅ Proper exception handling
            
            GitHub Copilot will analyze this PR and provide additional suggestions based on the project's coding standards.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
