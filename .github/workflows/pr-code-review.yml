name: Code Review on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'test/add-new-method'
      - 'main'
      - 'master'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean compile

      - name: Run Tests
        run: mvn test

      - name: Test Summary
        run: |
          echo "✅ Build completed successfully"
          mvn test 2>&1 | grep -E "Tests run:"

  automated-review:
    runs-on: ubuntu-latest
    needs: build-and-test
    name: Automated Code Review

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout base branch
        run: |
          git fetch origin ${{ github.base_ref }}

      - name: Review Java Code
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            console.log('Starting code review...');
            
            // Read review guidelines
            let guidelines = '';
            try {
              guidelines = fs.readFileSync('.github/copilot-instructions.md', 'utf8');
              console.log('✅ Loaded review guidelines');
            } catch (e) {
              console.log('⚠️ No copilot-instructions.md found, using default rules');
            }
            
            // Get all changed files in the PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            console.log(`Found ${files.length} changed file(s)`);
            
            const javaFiles = files.filter(f => f.filename.endsWith('.java'));
            console.log(`Reviewing ${javaFiles.length} Java file(s)`);
            
            let reviewComments = [];
            let issueCount = 0;
            
            // Review each Java file
            for (const file of javaFiles) {
              console.log(`\nReviewing: ${file.filename}`);
              
              // Skip deleted files
              if (file.status === 'removed') {
                console.log('  Skipped (deleted)');
                continue;
              }
              
              // Get file content from the patch
              const patch = file.patch || '';
              const addedLines = [];
              
              // Parse the patch to get line numbers and content
              let currentLine = 0;
              patch.split('\n').forEach(line => {
                if (line.startsWith('@@')) {
                  const match = line.match(/@@ -\d+,?\d* \+(\d+),?\d* @@/);
                  if (match) {
                    currentLine = parseInt(match[1]);
                  }
                } else if (line.startsWith('+') && !line.startsWith('+++')) {
                  addedLines.push({ line: currentLine, content: line.substring(1) });
                  currentLine++;
                } else if (!line.startsWith('-')) {
                  currentLine++;
                }
              });
              
              console.log(`  Found ${addedLines.length} added line(s)`);
              
              // Check each added line for issues
              addedLines.forEach(({ line, content }) => {
                let issues = [];
                
                // Check for System.out.println
                if (content.includes('System.out.println') || content.includes('System.err.println')) {
                  issues.push({
                    severity: 'error',
                    message: '❌ **Anti-pattern**: Using `System.out.println`',
                    suggestion: 'Replace with SLF4J logger: `logger.info("message")` or `logger.debug("message")`',
                    line: line
                  });
                }
                
                // Check for generic Exception catching
                if (content.match(/catch\s*\(\s*Exception\s+/)) {
                  issues.push({
                    severity: 'warning',
                    message: '⚠️ **Code smell**: Catching generic `Exception`',
                    suggestion: 'Catch specific exceptions like `IOException`, `NumberFormatException`, etc.',
                    line: line
                  });
                }
                
                // Check for empty catch blocks (simple check)
                if (content.match(/catch.*\{\s*\}/)) {
                  issues.push({
                    severity: 'error',
                    message: '🚫 **Critical**: Empty catch block',
                    suggestion: 'Add proper error handling or log the error: `logger.error("Error", e);`',
                    line: line
                  });
                }
                
                // Check for TODO comments
                if (content.match(/\/\/\s*TODO/i)) {
                  issues.push({
                    severity: 'info',
                    message: '📝 **Note**: TODO comment found',
                    suggestion: 'Create a ticket/issue or implement before merging',
                    line: line
                  });
                }
                
                // Check for magic numbers (basic check)
                const magicNumberMatch = content.match(/[^a-zA-Z_]\d{2,}[^a-zA-Z_0-9]/);
                if (magicNumberMatch && !content.includes('final') && !content.includes('return')) {
                  issues.push({
                    severity: 'info',
                    message: '💡 **Suggestion**: Possible magic number',
                    suggestion: 'Consider extracting to a named constant: `private static final int CONSTANT_NAME = value;`',
                    line: line
                  });
                }
                
                // Post comments for each issue
                issues.forEach(issue => {
                  reviewComments.push({
                    path: file.filename,
                    line: issue.line,
                    side: 'RIGHT',
                    body: `${issue.message}\n\n**Suggestion**: ${issue.suggestion}\n\n---\n*Automated review based on [coding guidelines](.github/copilot-instructions.md)*`
                  });
                  issueCount++;
                  console.log(`  ⚠️ Issue at line ${issue.line}: ${issue.message}`);
                });
              });
            }
            
            console.log(`\n📊 Review complete: Found ${issueCount} issue(s)`);
            
            // Create the review
            if (reviewComments.length > 0) {
              // Post review with comments
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'REQUEST_CHANGES',
                body: `## 🤖 Automated Code Review\n\n**Found ${issueCount} issue(s)** that should be addressed.\n\nReview based on guidelines in [\`.github/copilot-instructions.md\`](.github/copilot-instructions.md)\n\n### Summary\n- ❌ Anti-patterns detected\n- 📝 Code quality improvements needed\n\nPlease address these issues and push updates.`,
                comments: reviewComments
              });
              
              // Set workflow as failed
              core.setFailed(`Code review found ${issueCount} issue(s) that need attention`);
            } else {
              // Approve the PR
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'APPROVE',
                body: `## ✅ Automated Code Review Passed\n\n**No issues found!** 🎉\n\nAll code follows the guidelines in [\`.github/copilot-instructions.md\`](.github/copilot-instructions.md)\n\n### Checks Passed\n- ✅ No \`System.out.println\` usage\n- ✅ Proper exception handling\n- ✅ No empty catch blocks\n- ✅ Clean code patterns\n\nGreat work! This PR is ready for human review.`
              });
              
              console.log('✅ Review approved - no issues found');
            }
