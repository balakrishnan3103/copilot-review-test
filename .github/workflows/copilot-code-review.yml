name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.java'
      - 'pom.xml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    name: AI Code Review with Copilot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: |
          mvn clean test
        continue-on-error: true

      - name: GitHub Copilot Code Review
        uses: github/copilot-code-review-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          instructions-file: '.github/copilot-instructions.md'
          review-level: 'detailed'
          auto-comment: true

      - name: Post Review Summary
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.github/copilot-instructions.md';
            
            const message = `## 🤖 Copilot Code Review Complete
            
            This PR has been automatically reviewed using GitHub Copilot with the following guidelines:
            - ✅ Code Style and Standards
            - ✅ Testing Coverage
            - ✅ Error Handling
            - ✅ Documentation
            - ✅ Security Best Practices
            
            Please review the inline comments for detailed feedback.
            
            📋 Review based on: [Copilot Instructions](.github/copilot-instructions.md)
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
